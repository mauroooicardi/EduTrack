<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTrack — Professional Müəllim Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { 
      background-color: #fff8f9; 
      color: #1e293b; 
      padding: 40px 20px;
      overflow-x: hidden;
    }
    .container { max-width: 1050px; margin: 0 auto; }
    
    /* 🌟 ANIMATIONS */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 4px 20px rgba(236,72,153,0.05); }
      50% { box-shadow: 0 8px 25px rgba(236,72,153,0.12); }
      100% { box-shadow: 0 4px 20px rgba(236,72,153,0.05); }
    }

    /* HEADER */
    .header-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 30px; 
      background: #ffffff; 
      padding: 22px 32px; 
      border-radius: 20px; 
      border: 1px solid #fce7f3; 
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.05);
      animation: fadeInUp 0.5s ease-out;
    }
    .header-bar h1 { font-size: 24px; font-weight: 800; color: #1e293b; letter-spacing: -0.5px; }
    .header-bar h1 span { color: #ec4899; }
    
    /* CARDS */
    .card { 
      background: #ffffff; 
      border-radius: 22px; 
      padding: 32px; 
      border: 1px solid #fce7f3; 
      margin-bottom: 30px; 
      box-shadow: 0 4px 20px rgba(236,72,153,0.04);
      animation: fadeInUp 0.6s ease-out;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover {
      box-shadow: 0 15px 35px rgba(236,72,153,0.08);
      border-color: #fbcfe8;
    }
    .card h2 { 
      font-size: 17px; 
      font-weight: 700; 
      color: #1e293b; 
      margin-bottom: 22px; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    
    /* FORM INPUTS */
    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); 
      gap: 14px; 
      margin-bottom: 20px; 
    }
    input, select { 
      width: 100%; 
      padding: 13px 16px; 
      border-radius: 12px; 
      background: #fff5f7; 
      border: 1.5px solid #fbcfe8; 
      outline: none; 
      font-size: 14px; 
      font-weight: 500;
      color: #1e293b;
      transition: all 0.3s ease; 
    }
    input::placeholder { color: #94a3b8; }
    input:focus, select:focus { 
      border-color: #ec4899; 
      background: #ffffff; 
      box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.12);
      transform: translateY(-1px);
    }
    
    /* BUTTONS */
    .btn { 
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ec4899; 
      color: #fff; 
      border: none; 
      padding: 13px 28px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 14px;
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }
    .btn:hover { 
      background: #db2777; 
      transform: translateY(-3deg); 
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
    }
    .btn:active { transform: translateY(-1px); }
    
    .btn-dark { 
      background: #1e293b; 
      box-shadow: 0 4px 15px rgba(30, 41, 59, 0.2);
    }
    .btn-dark:hover { 
      background: #0f172a; 
      box-shadow: 0 8px 25px rgba(30, 41, 59, 0.3);
    }
    
    .btn-danger { 
      background: #ffe4e6; 
      color: #e11d48;
      padding: 8px 14px; 
      font-size: 12px; 
      border-radius: 8px; 
      box-shadow: none;
      font-weight: 600;
    }
    .btn-danger:hover {
      background: #f43f5e;
      color: #fff;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }

    /* STUDENT ITEM LIST */
    .student-item { 
      background: #ffffff; 
      border: 1px solid #fce7f3; 
      padding: 18px 24px; 
      border-radius: 16px; 
      margin-bottom: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      transition: all 0.3s ease;
      animation: fadeInUp 0.4s ease-out;
    }
    .student-item:hover {
      transform: translateX(6px);
      border-color: #fbcfe8;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.06);
    }
    .student-info strong { color: #1e293b; font-size: 16px; font-weight: 700; }
    .student-info small { color: #64748b; display: block; margin-top: 5px; font-size: 13px; }
    .badge { 
      background: #fdf2f8; 
      color: #ec4899; 
      padding: 8px 16px; 
      border-radius: 20px; 
      font-weight: 700; 
      font-size: 13px; 
      border: 1px solid #fbcfe8;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- HEADER -->
  <div class="header-bar">
    <h1>EduTrack | <span>Müəllim Paneli</span></h1>
    <a href="index.html" class="btn btn-dark" style="text-decoration:none;">Sayta Qayıt</a>
  </div>

  <!-- 1. ŞAGİRD QEYDİYYATI -->
  <div class="card">
    <h2>👤 1. Yeni Şagird və Valideyn Hesabı Yaradın</h2>
    <div class="form-grid">
      <input type="text" id="inpStName" placeholder="Şagirdin Adı Soyadı">
      <input type="text" id="inpStCode" placeholder="Şagird Kodu (Məs: S101)">
      <input type="text" id="inpPrName" placeholder="Valideynin Adı">
      <input type="text" id="inpPrCode" placeholder="Valideyn Kodu (Məs: V101)">
      
      <!-- 🌟 5-DƏN 11-Ə QƏDƏR SİNİFLƏR -->
      <select id="inpClass">
        <optgroup label="Buraxılış & DİM Hazırlığı">
          <option value="11-ci Sinif (DİM)">11-ci Sinif (DİM Hazırlığı)</option>
          <option value="10-cu Sinif (DİM)">10-cu Sinif (DİM Hazırlığı)</option>
          <option value="9-cu Sinif (Buraxılış)">9-cu Sinif (Buraxılış)</option>
        </optgroup>
        <optgroup label="Orta Məktəb (Baza)">
          <option value="8-ci Sinif">8-ci Sinif</option>
          <option value="7-ci Sinif">7-ci Sinif</option>
          <option value="6-cı Sinif">6-cı Sinif</option>
          <option value="5-ci Sinif">5-ci Sinif</option>
        </optgroup>
      </select>
    </div>
    <button class="btn" onclick="createNewStudent()">✨ Hesab Yarad</button>
  </div>

  <!-- 2. SİNAQ BALI DAXİL ET -->
  <div class="card">
    <h2>📝 2. Sınaq Balı Daxil Et (Həftəlik / Aylıq)</h2>
    <div class="form-grid">
      <select id="selectStudent">
        <option value="">Şagirdi Seçin...</option>
      </select>
      <select id="selectType">
        <option value="Həftəlik Sınaq">Həftəlik Sınaq</option>
        <option value="Aylıq Sınaq">Aylıq Sınaq</option>
        <option value="DİM Sınağı">DİM Sınağı</option>
        <option value="Mövzu Sınağı">Mövzu Qiymətləndirmə</option>
      </select>
      <input type="text" id="inpTitle" placeholder="Sınaq Mövusu (Məs: Törəmə / Triqonometriya)">
      <input type="number" id="inpScore" placeholder="Bal (0-100)" min="0" max="100">
    </div>
    <button class="btn btn-dark" onclick="addStudentScore()">🎯 Balı Yaz</button>
  </div>

  <!-- 3. SİYAHI -->
  <div class="card">
    <h2>📋 Qeydiyyatda Olan Şagirdlər və Nəticələr</h2>
    <div id="studentListContainer">
      <p style="text-align:center; color:#64748b; padding:20px;">Məlumatlar yüklənir...</p>
    </div>
  </div>

</div>

<script>
  const API_URL = "http://127.0.0.1:5000/api";

  document.addEventListener("DOMContentLoaded", fetchAllStudents);

  async function fetchAllStudents() {
    try {
      const res = await fetch(`${API_URL}/students`);
      const students = await res.json();
      renderUI(students);
    } catch (err) {
      console.error(err);
      document.getElementById('studentListContainer').innerHTML = 
        '<p style="color:#ef4444; text-align:center; padding:20px;">⚠️ Serverlə əlaqə qurulmadı. Terminalda "node server.js" işlədiyindən əmin olun!</p>';
    }
  }

  // 1. Yeni Şagird Yarat
  async function createNewStudent() {
    const studentName = document.getElementById('inpStName').value.trim();
    const studentCode = document.getElementById('inpStCode').value.trim();
    const parentName = document.getElementById('inpPrName').value.trim();
    const parentCode = document.getElementById('inpPrCode').value.trim();
    const studentClass = document.getElementById('inpClass').value;

    if (!studentName || !studentCode || !parentCode) {
      return alert("Zəhmət olmasa şagird adı, şagird kodu və valideyn kodunu yazın!");
    }

    try {
      const res = await fetch(`${API_URL}/students`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentName, studentCode, parentName, parentCode, studentClass })
      });

      if (res.ok) {
        alert("✅ Şagird uğurla daxil edildi!");
        document.getElementById('inpStName').value = '';
        document.getElementById('inpStCode').value = '';
        document.getElementById('inpPrName').value = '';
        document.getElementById('inpPrCode').value = '';
        fetchAllStudents();
      } else {
        alert("❌ Xəta yarandı!");
      }
    } catch (err) {
      alert("⚠️ Serverlə əlaqə xətası!");
    }
  }

  // 2. Sınaq Balı Əlavə Et
  async function addStudentScore() {
    const studentId = document.getElementById('selectStudent').value;
    const type = document.getElementById('selectType').value;
    const title = document.getElementById('inpTitle').value.trim();
    const score = document.getElementById('inpScore').value.trim();

    if (!studentId || !title || !score) {
      return alert("Zəhmət olmasa şagirdi seçin, mövzunu və balı yazın!");
    }

    try {
      const res = await fetch(`${API_URL}/students/score`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentId, type, title, score })
      });

      if (res.ok) {
        alert("✅ Sınaq balı qeyd edildi!");
        document.getElementById('inpTitle').value = '';
        document.getElementById('inpScore').value = '';
        fetchAllStudents();
      }
    } catch (err) {
      alert("⚠️ Bal əlavə edilərkən xəta yarandı!");
    }
  }

  // 3. Şagirdi Sil
  async function deleteStudent(id) {
    if (!confirm("Bu şagirdi silməyə əminsiniz?")) return;
    try {
      const res = await fetch(`${API_URL}/students/${id}`, { method: "DELETE" });
      if (res.ok) {
        fetchAllStudents();
      }
    } catch (err) {
      alert("Silinmə zamanı xəta oldu!");
    }
  }

  // UI RENDER
  function renderUI(students) {
    const select = document.getElementById('selectStudent');
    const container = document.getElementById('studentListContainer');

    select.innerHTML = '<option value="">Şagirdi Seçin...</option>';
    students.forEach(s => {
      select.innerHTML += `<option value="${s.id}">${s.studentName} (${s.studentCode})</option>`;
    });

    if (students.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">Hələ heç bir şagird daxil edilməyib.</p>';
      return;
    }

    container.innerHTML = '';
    students.forEach(s => {
      const lastScore = s.scores && s.scores.length > 0 
        ? `${s.scores[0].score} Bal (${s.scores[0].title})` 
        : 'Sınaq yoxdur';

      container.innerHTML += `
        <div class="student-item">
          <div class="student-info">
            <strong>${s.studentName}</strong> 
            <span style="color:#ec4899; font-weight:700; font-size:12px; margin-left:6px;">[Kod: ${s.studentCode}]</span>
            <small>Valideyn: ${s.parentName || 'Qeyd olunmayıb'} (Kod: ${s.parentCode}) • Sinif: ${s.studentClass}</small>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <span class="badge">${lastScore}</span>
            <button class="btn btn-danger" onclick="deleteStudent('${s.id}')">Sil</button>
          </div>
        </div>
      `;
    });
  }
</script>

</body>
</html>
